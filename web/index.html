<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Base href placeholder replaced by --base-href argument in flutter build.
    For GitHub Pages: --base-href /refrigeration-simulator/
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="FrigoLab — Simulador físico interactivo de instalaciones frigoríficas industriales en tiempo real con modelado termodinámico R-134a, instrumentación física y diagramas de ciclo.">
  <meta name="theme-color" content="#0B1120">

  <!-- Open Graph / Meta -->
  <meta property="og:title" content="FrigoLab — Simulador de Refrigeración Industrial">
  <meta property="og:description" content="Simulación termodinámica en tiempo real, esquemas P&ID interactivos, ciclos P-h y T-s, y telemetría SCADA.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FrigoLab">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FrigoLab — Simulador de Refrigeración Industrial</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B1120;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      position: absolute;
      top: 0;
      left: 0;
      background-color: #0B1120;
      transition: opacity 0.4s ease-out;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #38BDF8;
      margin-bottom: 8px;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #94A3B8;
      letter-spacing: 1px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="brand-title">FRIGOLAB</div>
    <div class="brand-subtitle">Simulador de Refrigeración Industrial</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
